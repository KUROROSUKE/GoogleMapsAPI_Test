<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Google Map</title>

  <style>
    html,
    body,
    #map {
      width: 100%;
      height: 100%;
      margin: 0;
    }
  </style>
</head>

<body>
  <div id="map"></div>

  <script>
    function initMap() {
      new google.maps.Map(document.getElementById("map"), {
        center: {
          lat: 35.681236,
          lng: 139.767125
        },
        zoom: 14
      });
    }
  </script>

  <script
    async
    src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDpxvrDWlOYTThlPACSGP4Y70ilWbYNFH8&loading=async&callback=initMap&language=ja&region=JP">
  </script>
</body>
</html>
